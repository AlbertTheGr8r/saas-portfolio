version: 2
updates:
  # JavaScript/TypeScript dependencies (package.json + pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 5
    # "increase" (not increase-if-necessary) so patch releases inside a `^`
    # range also refresh pnpm-lock.yaml. Most of this repo's alerts are on
    # transitive deps, which only move when the lockfile is regenerated.
    versioning-strategy: "increase"
    commit-message:
      prefix: "deps"
      prefix-development: "deps-dev"
      include: "scope"
    groups:
      # Routine minor + patch bumps, auto-merged after CI passes.
      minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Major bumps land in their own PR and are never auto-merged.
      major:
        patterns: ["*"]
        update-types: ["major"]
    # Security updates are intentionally left ungrouped: one unfixable
    # transitive dep (e.g. @vitest/mocker) would otherwise block the whole
    # group, and individual PRs get SemVer labels the auto-merge job can use.

  # Keep GitHub Actions pinned versions fresh (checkout, setup-node, etc.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Asia/Manila"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
