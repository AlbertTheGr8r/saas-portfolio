name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    # 09:00 PHT on the 15th and 30th. GitHub cron runs in UTC.
    - cron: "0 1 15,30 * *"
    # February has no 30th; rebuild on the 28th and 29th.
    - cron: "0 1 28 2 *"
    - cron: "0 1 29 2 *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Build with Next.js
        run: pnpm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare Cache
        uses: cssnr/cf-purge-cache-action@v2
        with:
          # v2 takes a `zones` list of zone names; with no files/tags/hosts
          # filters it purges everything. `domains`, `zone` and `args` were
          # removed in the v1 -> v2 bump.
          token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          zones: antiparity.net

