name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # The feed/build assertions in src/tests/build.test.ts inspect files
      # produced by the build, so build comes first.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run

  auto-merge:
    name: Auto-merge minor and patch updates
    needs: build-and-test
    # Only the author is checked here: Dependabot applies the `minor`/`patch`
    # SemVer labels a few seconds *after* opening the PR, so the label list in
    # the `pull_request` event payload is often empty (see #29, which was left
    # unmerged). The labels are read from the API in the merge step instead.
    # Grouped PRs may carry no SemVer label at all, hence the branch fallback.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge
        # If the branch is stale (Dependabot PRs all touch pnpm-lock.yaml, so
        # concurrent merges conflict easily), ask Dependabot to rebase instead
        # of leaving a red run. The rebase triggers CI again, then this job
        # retries the merge.
        run: |
          labels=$(gh pr view "$PR_URL" --json labels --jq '[.labels[].name] | join(" ")')

          if ! grep -Eq '(^| )(minor|patch)( |$)' <<< "$labels" &&
             [[ "$HEAD_REF" != *minor-patch* ]]; then
            echo "Not a minor/patch update (labels: ${labels:-none}); leaving open."
            exit 0
          fi

          gh pr merge --squash --delete-branch "$PR_URL" ||
            gh pr comment "$PR_URL" --body "@dependabot rebase"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_REF: ${{ github.head_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
