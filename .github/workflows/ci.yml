name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The feed/build assertions in src/tests/build.test.ts inspect files
      # produced by the build (and its postbuild step), so build comes first.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:run

  auto-merge:
    name: Auto-merge minor and patch updates
    needs: build-and-test
    # Dependabot applies the `minor`/`patch` SemVer labels to single-dependency
    # PRs (the labels exist in the repo). Grouped PRs carry no SemVer label, so
    # fall back to the group identifier in the branch name.
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'minor') ||
       contains(github.event.pull_request.labels.*.name, 'patch') ||
       contains(github.head_ref, 'minor-patch'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge
        # If the branch is stale (Dependabot PRs all touch pnpm-lock.yaml, so
        # concurrent merges conflict easily), ask Dependabot to rebase instead
        # of leaving a red run. The rebase triggers CI again, then this job
        # retries the merge.
        run: |
          gh pr merge --squash --delete-branch "$PR_URL" ||
            gh pr comment "$PR_URL" --body "@dependabot rebase"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
